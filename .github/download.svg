<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="90" y1="18" x2="1110" y2="505" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.48" stop-color="#0B1024"/>
      <stop offset="1" stop-color="#11102A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C084FC"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="translate(921 212) rotate(134) scale(111)">
      <stop stop-color="#A5F3FC"/>
      <stop offset="0.35" stop-color="#2563EB"/>
      <stop offset="0.73" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#17142D"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="skewX(-18)">
      <path d="M36 0H0V36" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.7"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="520" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="520" fill="url(#bg)"/>
    <rect y="305" width="1200" height="215" fill="url(#grid)"/>
    <circle cx="1090" cy="-5" r="260" fill="#2563EB" fill-opacity="0.12"/>
    <circle cx="115" cy="503" r="240" fill="#06B6D4" fill-opacity="0.08"/>
    <circle cx="622" cy="520" r="210" fill="#7C3AED" fill-opacity="0.08"/>

    <g fill="#E0F2FE">
      <circle cx="72" cy="73" r="2"/><circle cx="171" cy="38" r="1.5"/><circle cx="314" cy="85" r="1"/>
      <circle cx="752" cy="46" r="1.5"/><circle cx="839" cy="87" r="1"/><circle cx="1120" cy="79" r="2"/>
      <circle cx="1072" cy="304" r="1.5"/><circle cx="676" cy="144" r="1"/><circle cx="465" cy="33" r="1.5"/>
    </g>

    <g transform="translate(72 76)">
      <rect width="494" height="8" rx="4" fill="url(#cyan)" filter="url(#glow)"/>
      <text x="0" y="73" fill="#F8FAFC" font-size="54" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="-1.5">AHMED ATIA</text>
      <text x="2" y="112" fill="#67E8F9" font-size="20" font-weight="700" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" letter-spacing="2">FRONTEND ENGINEER // PLAYER 01</text>
      <text x="2" y="160" fill="#94A3B8" font-size="20" font-family="Inter,Segoe UI,Arial,sans-serif">I turn complex product requirements into</text>
      <text x="2" y="190" fill="#E2E8F0" font-size="20" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">fast, scalable &amp; memorable web experiences.</text>

      <g transform="translate(0 232)">
        <rect width="154" height="42" rx="21" fill="#0F2138" stroke="#38BDF8" stroke-opacity="0.55"/>
        <circle cx="24" cy="21" r="6" fill="#22D3EE" filter="url(#glow)"/>
        <text x="41" y="27" fill="#CFFAFE" font-size="14" font-weight="700" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">OPEN TO WORK</text>
      </g>
      <g transform="translate(168 232)">
        <rect width="133" height="42" rx="21" fill="#17162E" stroke="#8B5CF6" stroke-opacity="0.7"/>
        <text x="27" y="27" fill="#DDD6FE" font-size="14" font-weight="700" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">EGYPT // EG</text>
      </g>

      <g transform="translate(0 315)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
        <text x="0" y="0" fill="#64748B" font-size="13">CURRENT LOADOUT</text>
        <text x="0" y="34" fill="#7DD3FC" font-size="16">React</text><text x="58" y="34" fill="#475569">•</text>
        <text x="76" y="34" fill="#F8FAFC" font-size="16">Next.js</text><text x="145" y="34" fill="#475569">•</text>
        <text x="163" y="34" fill="#60A5FA" font-size="16">TypeScript</text><text x="260" y="34" fill="#475569">•</text>
        <text x="278" y="34" fill="#C084FC" font-size="16">Three.js</text>
      </g>
    </g>

    <!-- Isometric gaming workstation -->
    <g transform="translate(650 42)" filter="url(#shadow)">
      <ellipse cx="265" cy="385" rx="235" ry="67" fill="#020617" fill-opacity="0.75"/>
      <path d="M81 332L266 225L454 333L267 441L81 332Z" fill="#172554" stroke="#38BDF8" stroke-opacity="0.35"/>
      <path d="M81 332L267 441V466L81 358V332Z" fill="#0F1B3D"/>
      <path d="M267 441L454 333V359L267 466V441Z" fill="#101749"/>

      <!-- holographic orb -->
      <circle cx="270" cy="171" r="103" fill="#2563EB" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.22"/>
      <ellipse cx="270" cy="171" rx="125" ry="36" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="2" transform="rotate(-14 270 171)"/>
      <circle cx="270" cy="171" r="77" fill="url(#orb)" stroke="#A5F3FC" stroke-opacity="0.45"/>
      <path d="M217 193C246 152 291 126 330 122C310 158 289 189 251 219C237 214 225 205 217 193Z" fill="#38BDF8" fill-opacity="0.42"/>
      <path d="M237 111C264 97 296 98 321 115C280 117 252 136 218 162C219 141 226 124 237 111Z" fill="#C084FC" fill-opacity="0.38"/>
      <circle cx="244" cy="141" r="8" fill="#E0F2FE" filter="url(#glow)"/>

      <!-- laptop -->
      <path d="M132 258L281 172L373 225L223 312L132 258Z" fill="#0A1228" stroke="#60A5FA" stroke-width="2"/>
      <path d="M151 257L281 182L354 225L223 301L151 257Z" fill="#08111F"/>
      <path d="M169 257L278 194L337 227L228 291L169 257Z" fill="#071827" stroke="#22D3EE" stroke-opacity="0.35"/>
      <path d="M153 272L222 313L375 225L378 240L223 330L153 289V272Z" fill="#1E3A8A"/>
      <path d="M222 313L375 225L378 240L223 330L222 313Z" fill="#2563EB"/>
      <g stroke-linecap="round">
        <path d="M207 254L230 240" stroke="#C084FC" stroke-width="4"/>
        <path d="M238 236L292 205" stroke="#38BDF8" stroke-width="4"/>
        <path d="M219 268L251 249" stroke="#F97316" stroke-width="4"/>
        <path d="M259 245L315 213" stroke="#60A5FA" stroke-width="4"/>
      </g>

      <!-- floating code card -->
      <g transform="translate(-18 103) rotate(-5)">
        <rect width="132" height="112" rx="13" fill="#0B1729" stroke="#22D3EE" stroke-opacity="0.55"/>
        <circle cx="18" cy="17" r="3" fill="#F97316"/><circle cx="29" cy="17" r="3" fill="#FBBF24"/><circle cx="40" cy="17" r="3" fill="#22C55E"/>
        <path d="M20 42H72M20 58H108M20 74H93M20 90H61" stroke="url(#cyan)" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- controller -->
      <g transform="translate(386 151) rotate(8)">
        <path d="M14 38C17 19 32 8 50 10L95 12C113 13 127 27 128 46L131 80C132 96 113 104 103 91L91 75H49L36 90C25 102 7 93 9 77L14 38Z" fill="#17162E" stroke="#A78BFA" stroke-width="2"/>
        <path d="M42 35V61M29 48H55" stroke="#67E8F9" stroke-width="7" stroke-linecap="round"/>
        <circle cx="100" cy="40" r="6" fill="#F97316"/><circle cx="114" cy="54" r="6" fill="#22D3EE"/>
        <circle cx="72" cy="67" r="5" fill="#64748B"/><circle cx="86" cy="67" r="5" fill="#64748B"/>
      </g>

      <!-- level badge -->
      <g transform="translate(391 286)">
        <path d="M0 18L20 0H104L122 18V64L104 82H20L0 64V18Z" fill="#0C1930" stroke="#38BDF8" stroke-opacity="0.65"/>
        <text x="61" y="33" text-anchor="middle" fill="#64748B" font-size="12" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">FRONTEND LVL</text>
        <text x="61" y="62" text-anchor="middle" fill="#F8FAFC" font-size="24" font-weight="800" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">∞</text>
      </g>
    </g>

    <path d="M0 505C180 470 337 530 521 496C746 455 928 530 1200 481V520H0V505Z" fill="#0EA5E9" fill-opacity="0.12"/>
  </g>
</svg>
